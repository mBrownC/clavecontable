<!DOCTYPE html>
<html lang="es-CL">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, follow">
        <title>Mensaje Enviado - ClaveContable</title>
        <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon/favicon-32x32.png">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="../assets/css/pages/gracias.css">
    </head>
    <body>
        <div class="success-card">
            <i class="fas fa-check-circle success-icon"></i>
            <h1>¡Mensaje Enviado!</h1>
            <p>Gracias por contactarnos. Hemos recibido tu mensaje y nos
                pondremos en contacto contigo a la brevedad.</p>
            <p><strong>Tiempo de respuesta:</strong> Dentro de las próximas 24
                horas hábiles.</p>

            <a href="../index.html" class="btn btn-primary">
                <i class="fas fa-home me-2"></i>Volver al Inicio
            </a>

            <div class="contact-info">
                <p><i class="fas fa-phone" aria-hidden="true"></i>
                    <a data-contact="phone"></a></p>
                <p><i class="fas fa-envelope" aria-hidden="true"></i>
                    <a data-contact="email"></a></p>
            </div>
        </div>

        <script type="module" src="../assets/js/config.js"></script>
        <script src="../assets/js/pages/gracias.js" defer></script>
    </body>
