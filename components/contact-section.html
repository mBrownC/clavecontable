<!-- Contacto Section - Diseño Completo -->
<section id="contacto" class="contact-section-complete">

    <!-- Redes Sociales en la parte superior -->
    <div class="social-header">
        <h4>Síguenos en Redes Sociales</h4>
        <div class="social-links">
            <a href="javascript:void(0)" target="_blank"
                rel="noopener noreferrer"
                class="social-link"
                aria-label="Visitar ClaveContable Ltda. en Facebook">
                <i class="fab fa-facebook fa-2x" aria-hidden="true"></i>
            </a>
            <a href="javascript:void(0)" target="_blank"
                rel="noopener noreferrer"
                class="social-link"
                aria-label="Visitar ClaveContable Ltda. en Instagram">
                <i class="fab fa-instagram fa-2x" aria-hidden="true"></i>
            </a>
            <a href="javascript:void(0)" target="_blank"
                rel="noopener noreferrer"
                class="social-link"
                aria-label="Contactar ClaveContable Ltda. por WhatsApp">
                <i class="fab fa-whatsapp fa-2x" aria-hidden="true"></i>
            </a>
        </div>
    </div>

    <!-- Contenedor sin mapa -->
    <div class="contact-container-with-map">

        <!-- Grid con Información y Formulario -->
        <div class="contact-content-grid">

            <!-- Lado Izquierdo - Información -->
            <div class="contact-info-card-left">
                <h2>Contáctanos<br>y nos tomamos un café</h2>

                <div class="info-items">
                    <div class="info-item">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <a href="javascript:void(0)">Cargando...</a>
                    </div>

                    <div class="info-item">
                        <i class="fas fa-phone" aria-hidden="true"></i>
                        <a href="javascript:void(0)">Cargando...</a>
                    </div>

                    <div class="info-item">
                        <i class="fas fa-clock" aria-hidden="true"></i>
                        <div>
                            <p><strong>Horario de Atención</strong></p>
                            <p class="schedule-weekdays">Cargando...</p>
                            <p class="schedule-saturday">Cargando...</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fas fa-check-circle" aria-hidden="true"></i>
                        <div>
                            <p><strong>Respuesta rápida garantizada</strong></p>
                            <p>Te contactaremos en menos de 24 horas</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lado Derecho - Formulario -->
            <div class="contact-form-card-right">
                <h2 class="form-title">Cotiza tu Servicio</h2>

                <form class="contact-form" id="contactForm" method="POST"
                    aria-label="Formulario de contacto ClaveContable Ltda.">

                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre"
                            placeholder="Nombre Completo"
                            autocomplete="name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono"
                            placeholder="+56 9 XXXX XXXX"
                            autocomplete="tel"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="servicio">Servicio de Interés:</label>
                        <select id="servicio" name="servicio" required>
                            <option value>Seleccione un servicio</option>
                            <option value="plan-inicia">Plan Inicia - 1
                                UF/mes</option>
                            <option value="plan-crea">Plan Crea - 2.5
                                UF/mes</option>
                            <option value="pyme-pro">Pyme Pro - 3.5
                                UF/mes</option>
                            <option value="contabilidad">Servicios
                                Contables</option>
                            <option value="rrhh">Servicios RRHH</option>
                            <option value="web">Creación de Página Web</option>
                            <option value="servidores">Administración de
                                Servidores</option>
                            <option value="software">Desarrollo de Software a
                                Medida</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="3"
                            placeholder="Cuéntanos sobre tu empresa y qué servicio necesitas"
                            required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        Solicitar Asesoría Contable Gratis
                    </button>
                </form>
            </div>

        </div>
    </div>
</section>
