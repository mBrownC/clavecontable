        <!-- Google Analytics GA4: gtag.js se descarga después, para no competir
             con el contenido (los eventos se encolan en dataLayer) -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-H6ZH8DN12K');
            // Se carga con la primera interacción del visitante o a los 5 s, lo que ocurra primero
            (function () {
                var listo = false;
                var eventos = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
                var cargar = function () {
                    if (listo) return;
                    listo = true;
                    eventos.forEach(function (e) { removeEventListener(e, cargar); });
                    var s = document.createElement('script');
                    s.async = true;
                    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-H6ZH8DN12K';
                    document.head.appendChild(s);
                };
                eventos.forEach(function (e) { addEventListener(e, cargar, { once: true, passive: true }); });
                setTimeout(cargar, 5000);
            })();
        </script>
